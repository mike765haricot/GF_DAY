<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Girlfriend Day, Stakyra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="particles-container" aria-hidden="true"></div>

    <main class="content-wrapper">
        <header class="hero">
            <p class="eyebrow">Pour ma Stakyra</p>
            <h1 class="glowing-text">Joyeuse Fête,<br>Stakyra</h1>
            <p class="subtitle">Mon univers depuis le premier jour, et tout ce qu’on construit ensemble.</p>
        </header>

        <section class="timeline-counter" aria-label="Compteur de temps ensemble">
            <div class="glass-panel">
                <h2>Notre temps ensemble</h2>
                <div id="live-counter" class="counter-grid"></div>
            </div>
        </section>

        <section class="interactive-cards">
            <article class="card floating-element">
                <h3>Nos souvenirs</h3>
                <p>Chaque instant devient une lumière dans mon univers.</p>
            </article>
            <article class="card floating-element delay-1">
                <h3>Prochaine étape</h3>
                <p>Madrid, nos rêves et tout ce qu’on partage encore.</p>
            </article>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
